services:

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: sweetwagon-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - sweetwagon

  redis:
    image: redis:7-alpine
    container_name: sweetwagon-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sweetwagon

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sweetwagon-api
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost,http://127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sweetwagon

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sweetwagon-scraper
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "while true; do
        python scraper.py;
        sleep 60;
      done"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sweetwagon

  caddy:
    image: caddy:2-alpine
    container_name: sweetwagon-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - sweetwagon

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  sweetwagon:
    driver: bridge
